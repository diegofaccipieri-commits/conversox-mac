name: ConversoxMac
options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1

targets:
  ConversoxMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/ConversoxMac
    dependencies:
      - package: Sparkle
    info:
      path: ConversoxMac/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ConversoxMac OAuth Callback
            CFBundleURLSchemes:
              - conversoxmac
        NSHumanReadableCopyright: ""
        SUFeedURL: https://diegofaccipieri-commits.github.io/conversox-mac/appcast.xml
        SUPublicEDKey: mTJgzCePMVpv0TEK3j6LOoiAPl/OnCMSorKoJz8EJ2Q=
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.conversoxmac
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
